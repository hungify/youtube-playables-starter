<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="./favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="stylesheet" href="./style.css" />
        <title>Gem Drift</title>
        <!-- Load the YouTube Playables SDK as the first script on the page. -->
        <script src="https://www.youtube.com/game_api/v1"></script>
    </head>

    <body>
        <div id="gameParent"></div>

        <div id="hud" class="hud" hidden>
            <span id="score"></span>
            <span id="combo"></span>
            <span id="timer"></span>
        </div>

        <section id="menu" class="overlay" hidden>
            <h1 id="menuTitle"></h1>
            <p id="menuBest"></p>
            <button id="playButton" type="button"></button>
            <p id="menuHint" class="hint"></p>
        </section>

        <section id="gameOver" class="overlay" hidden>
            <h1 id="gameOverTitle"></h1>
            <p id="gameOverScore"></p>
            <p id="gameOverBest"></p>
            <button id="playAgainButton" type="button"></button>
        </section>

        <div id="paused" hidden role="status"></div>

        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
